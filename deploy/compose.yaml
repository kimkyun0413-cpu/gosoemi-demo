services:
  app:
    build:
      context: ..
    env_file: ../.env
    restart: unless-stopped
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Do not publish 8501. Only the TLS proxy can reach the app.
  proxy:
    image: caddy:2.10
    environment:
      GOSOMI_DOMAIN: ${GOSOMI_DOMAIN:-gosomi.ai.kr}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
